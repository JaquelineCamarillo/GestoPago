# ==========================================================
# Configuracion general de la aplicacion
# ==========================================================
spring.application.name=proyecto-servicios
server.port=${SERVER_PORT:8081}

# ==========================================================
# Base de datos (Sales Force / Postgres)
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/proyecto_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# ==========================================================
# GestoPago (PuntoRed) - Autenticacion
# Documentacion: https://documenter.getpostman.com/view/19876210/Uz5MFtdn
# ==========================================================
gestopago.base-url=${GESTOPAGO_BASE_URL:https://gestopago.portalventas.net}
gestopago.auth.url=${gestopago.base-url}
gestopago.api.url=${gestopago.base-url}

# Credenciales del distribuidor: NUNCA hardcodeadas, se inyectan por variables de entorno
gestopago.auth.id-distribuidor=${GESTOPAGO_ID_DISTRIBUIDOR:0}
gestopago.auth.codigo-dispositivo=${GESTOPAGO_CODIGO_DISPOSITIVO:}
gestopago.auth.password=${GESTOPAGO_PASSWORD:}

# Renovacion automatica de token (ms). El token de GestoPago expira cada 24h.
gestopago.auth.refresh-rate-ms=${GESTOPAGO_REFRESH_RATE_MS:3600000}

# Sincronizacion del catalogo de productos: una vez al dia (GestoPago bloquea la IP si se llama mas de 3 veces/dia)
gestopago.productos.sync-cron=${GESTOPAGO_PRODUCTOS_SYNC_CRON:0 0 3 * * *}

# Timeouts del cliente Feign hacia GestoPago (ms)
gestopago.client.connect-timeout-ms=${GESTOPAGO_CONNECT_TIMEOUT_MS:5000}
gestopago.client.read-timeout-ms=${GESTOPAGO_READ_TIMEOUT_MS:15000}

# ==========================================================
# Logging
# ==========================================================
logging.level.root=INFO
logging.level.com.proyecto.servicios=DEBUG
logging.level.com.proyecto.servicios.client=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n